<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>柚子的衣柜 - 购买商品记录管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #fff7fa;
            color: #333;
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }
        body.dark {
            background-color: #161316;
            color: #f3edf2;
        }

        /* ===== 顶部 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 16px;
            font-size: 12px;
            color: #333;
            background: #fff8f8;
        }
        body.dark .status-bar {
            background: #161316;
            color: #f3edf2;
        }
        body.dark .status-bar .icons svg {
            fill: #f3edf2;
        }
        .status-bar .time {
            font-weight: 600;
        }
        .status-bar .icons {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-bar .icons svg {
            width: 14px;
            height: 14px;
            fill: #333;
        }

        /* ===== 导航栏 ===== */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #fff8f8;
            border-bottom: 1px solid #f0e0e0;
        }
        body.dark .nav-bar {
            background: #161316;
            border-bottom-color: #332a31;
        }
        .nav-bar .left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        body.dark .nav-bar .right .action-btn {
            color: #f3edf2;
        }
        .nav-bar .logo {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-bar .logo .logo-icon {
            background: #ff4757;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .nav-bar .logo .logo-text {
            font-size: 16px;
            font-weight: 600;
        }
        .nav-bar .right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-bar .right .action-btn {
            font-size: 18px;
            cursor: pointer;
            color: #333;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .nav-bar .right .theme-btn {
            border: 1px solid #f0d9e5;
            background: #fff;
            color: #333;
            font-size: 14px;
        }
        body.dark .nav-bar .right .theme-btn {
            border-color: #473642;
            background: #241d23;
            color: #f3edf2;
        }
        .nav-bar .right .action-btn:hover {
            background: #f0e0e0;
        }

        /* ===== 头部信息 ===== */
        .header-info {
            padding: 18px 20px 10px;
            background: #fff7fa;
        }
        body.dark .header-info {
            background: #161316;
        }
        .header-topline {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
        }
        .header-title-group {
            min-width: 0;
        }
        .header-info .title {
            font-size: 26px;
            font-weight: 800;
            color: #000;
            margin-bottom: 6px;
            line-height: 1.15;
        }
        body.dark .header-info .title {
            color: #fff;
        }
        .header-info .subtitle {
            font-size: 14.5px;
            color: #7f747b;
            line-height: 1.4;
            font-weight: 500;
        }
        .header-info .subtitle span {
            margin-right: 14px;
        }
        .header-sort-btn {
            flex: 0 0 auto;
            margin-top: 2px;
            min-width: 58px;
            height: 34px;
            border: none;
            border-radius: 999px;
            background: #fff;
            color: #ff4fa8;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(255, 105, 180, 0.16);
        }
        body.dark .header-sort-btn {
            background: #2a2028;
            color: #ff8bc8;
            box-shadow: none;
        }
        /* ===== 标签切换 ===== */
        .tab-bar {
            display: flex;
            gap: 8px;
            padding: 4px 20px 14px;
            background: #fff7fa;
            border-bottom: 1px solid #f0e0e0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        body.dark .tab-bar {
            background: #161316;
            border-bottom-color: #332a31;
        }
        .tab-bar::-webkit-scrollbar {
            display: none;
        }
        .tab-bar .tab-item {
            flex: 1 0 0;
            min-width: 0;
            height: 38px;
            padding: 0 10px;
            font-size: 14px;
            font-weight: 600;
            color: #5f555b;
            cursor: pointer;
            border-radius: 999px;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body.dark .tab-bar .tab-item {
            color: #cdbfc8;
        }
        .tab-bar .tab-item.active {
            background: #ff69b4;
            color: #fff;
            box-shadow: 0 6px 14px rgba(255, 105, 180, 0.22);
        }
        .tab-bar .tab-item:hover:not(.active) {
            background: #ffe0ec;
        }
        body.dark .tab-bar .tab-item:hover:not(.active) {
            background: #2a2028;
        }

        /* ===== 商品网格 ===== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            column-gap: 18px;
            row-gap: 26px;
            padding: 28px 34px 96px;
            background: #fff7fa;
            border-radius: 0;
        }
        .product-card {
            background: transparent;
            border-radius: 0;
            overflow: visible;
            box-shadow: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        body.dark .product-card {
            background: transparent;
            box-shadow: none;
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: none;
        }
        .product-card .img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fff;
            overflow: hidden;
            border-radius: 18px;
        }
        .product-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        body.dark .product-card .img-wrap {
            background: #2a2429;
        }
        .product-card .img-wrap .placeholder-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            color: #ddd;
        }
        .product-card .img-wrap .tag {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            min-width: 62px;
            padding: 4px 12px;
            border-radius: 0 0 8px 8px;
            background: #ff86ad;
            color: #fff;
            text-align: center;
            font-size: 12px;
            line-height: 1.2;
            white-space: nowrap;
        }
        .product-card .quick-edit {
            position: absolute;
            right: 5px;
            bottom: 5px;
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            color: #ff4fa8;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        body.dark .product-card .quick-edit {
            background: rgba(33, 27, 32, 0.92);
            color: #ff8bc8;
        }
        .product-card .card-body {
            position: relative;
            padding: 8px 0 0;
            text-align: center;
        }
        .product-card .card-body .name {
            font-size: 15px;
            color: #000;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 20px;
            padding: 0 2px;
        }
        body.dark .product-card .card-body .name {
            color: #fff;
        }
        .product-card .card-body .price {
            font-size: 17px;
            color: #ff69b4;
            font-weight: 700;
            margin-top: 7px;
        }
        .product-card .card-body .payment-row {
            display: none;
        }
        .payment-type {
            display: inline-flex;
            align-items: center;
            max-width: 100%;
            padding: 2px 7px;
            border-radius: 999px;
            background: #fff0f6;
            color: #ff4fa8;
            font-size: 10px;
            line-height: 1.5;
            white-space: nowrap;
        }
        .payment-type.deposit {
            background: #fff7d9;
            color: #b27800;
        }
        .payment-type.balance {
            background: #eaf2ff;
            color: #2f63c7;
        }
        .payment-type.shipping {
            background: #ebf8ef;
            color: #24844d;
        }
        body.dark .payment-type {
            background: #382332;
            color: #ff8bc8;
        }
        body.dark .payment-type.deposit {
            background: #3a3017;
            color: #f0c85a;
        }
        body.dark .payment-type.balance {
            background: #1d2a42;
            color: #8fb5ff;
        }
        body.dark .payment-type.shipping {
            background: #1d3527;
            color: #77d596;
        }
        body.dark .product-grid {
            background: #161316;
        }
        .product-card .card-body .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .product-card .card-body .meta .status {
            font-size: 10px;
            color: #999;
        }
        .product-card .card-body .meta .qty {
            font-size: 10px;
            color: #ccc;
        }

        /* ===== 底部添加按钮 ===== */
        .add-btn-wrap {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
        }
        .add-btn-wrap .add-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ff69b4;
            color: #fff;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .add-btn-wrap .add-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(255, 105, 180, 0.5);
        }

        /* ===== 弹窗/表单 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.42);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 22px;
            width: 100%;
            max-width: 500px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 18px 18px 20px;
            animation: modalPop 0.22s ease;
            box-shadow: 0 18px 46px rgba(0, 0, 0, 0.18);
        }
        body.dark .modal-content {
            background: #211b20;
            color: #f3edf2;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-content .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .modal-content .modal-header h3 {
            font-size: 22px;
            font-weight: 700;
            color: #2a2528;
        }
        .modal-content .modal-header .close-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: #f5f5f5;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }
        body.dark .modal-content .modal-header .close-btn {
            background: #302730;
            color: #f3edf2;
        }
        body.dark .modal-content .modal-header h3 {
            color: #f3edf2;
        }
        .sort-modal-content {
            max-width: 520px;
            max-height: 82vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .sort-list {
            display: grid;
            gap: 8px;
            overflow-y: auto;
            padding: 2px 2px 8px;
            max-height: 58vh;
        }
        .sort-drag-hint {
            display: none;
            margin: -2px 0 10px;
            padding: 8px 10px;
            border-radius: 12px;
            background: #fff0f6;
            color: #ff4fa8;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }
        body.sort-dragging .sort-drag-hint {
            display: block;
        }
        .sort-row {
            display: grid;
            grid-template-columns: 32px 46px minmax(0, 1fr);
            align-items: center;
            gap: 10px;
            padding: 9px;
            border: 1px solid #f4e6ee;
            border-radius: 14px;
            background: #fffafb;
            user-select: none;
            cursor: grab;
            touch-action: none;
            transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease, border-color 0.16s ease, background 0.16s ease;
        }
        .sort-row.dragging {
            position: relative;
            opacity: 1;
            transform: none;
            border-color: #ff69b4;
            border-style: dashed;
            background: #fff0f6;
            box-shadow: inset 0 0 0 1px rgba(255, 105, 180, 0.18);
            cursor: grabbing;
        }
        .sort-row.dragging > * {
            opacity: 0.18;
        }
        .sort-row.dragging::after {
            content: "放到这里";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 4px 10px;
            border-radius: 999px;
            background: #ff69b4;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        body.sort-dragging {
            overscroll-behavior: contain;
        }
        body.sort-dragging .sort-row:not(.dragging) {
            opacity: 0.72;
        }
        .sort-number-badge {
            width: 32px;
            height: 32px;
            border-radius: 12px;
            background: #fff0f6;
            color: #ff4fa8;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .sort-grip {
            display: none !important;
        }
        .sort-index {
            font-size: 13px;
            font-weight: 700;
            line-height: 1;
        }
        .sort-row.dragging .sort-number-badge {
            background: #ff69b4;
            color: #fff;
        }
        body.dark .sort-row {
            border-color: #3b3038;
            background: #181316;
        }
        body.dark .sort-row.dragging {
            border-color: #ff8bc8;
            background: #2a1c27;
            box-shadow: 0 14px 30px rgba(255, 139, 200, 0.18);
        }
        body.dark .sort-drag-hint {
            background: #342431;
            color: #ff8bc8;
        }
        body.dark .sort-number-badge {
            background: #342431;
            color: #ff8bc8;
        }
        .sort-drag-ghost {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
            pointer-events: none;
            display: grid;
            grid-template-columns: 34px 46px minmax(0, 1fr);
            align-items: center;
            gap: 10px;
            padding: 9px;
            border: 2px solid #ff69b4;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 18px 40px rgba(255, 105, 180, 0.34), 0 8px 18px rgba(0, 0, 0, 0.12);
            transform: rotate(-1.2deg) scale(1.03);
        }
        body.dark .sort-drag-ghost {
            background: #211b20;
            border-color: #ff8bc8;
        }
        .sort-thumb {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            object-fit: cover;
            background: #f4f1f3;
        }
        .sort-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: 20px;
        }
        .sort-name {
            color: #242024;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        body.dark .sort-name {
            color: #f3edf2;
        }
        .sort-meta {
            margin-top: 4px;
            color: #9b9097;
            font-size: 12px;
        }
        .sort-empty {
            padding: 26px 10px;
            text-align: center;
            color: #9b9097;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 7px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 2px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            min-height: 42px;
            border: 1px solid #eee;
            border-radius: 12px;
            font-size: 14px;
            color: #333;
            background: #fafafa;
            outline: none;
            transition: border-color 0.2s;
        }
        body.dark .form-group input,
        body.dark .form-group select,
        body.dark .form-group textarea {
            border-color: #3b3038;
            background: #171216;
            color: #f3edf2;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #ff69b4;
            background: #fff;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 42px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1.1fr 0.8fr 1fr;
            gap: 10px;
            align-items: start;
        }
        .form-row.two-col {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: end;
        }
        .form-row label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 3px;
        }
        .form-row .form-group {
            margin-bottom: 7px;
            min-width: 0;
        }
        .form-row.two-col .form-group input {
            height: 46px;
        }
        .checkbox-line {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            color: #666;
            font-size: 13px;
            cursor: pointer;
        }
        .checkbox-line input {
            width: auto;
        }
        body.dark .checkbox-line {
            color: #d8cbd3;
        }
        .payment-summary-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fafafa;
        }
        .payment-summary-text {
            color: #333;
            font-size: 14px;
            line-height: 1.4;
        }
        .payment-summary-box button,
        .payment-editor-actions button {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            background: #fff0f6;
            color: #ff4fa8;
            white-space: nowrap;
        }
        .payment-editor-list {
            display: grid;
            gap: 12px;
            max-height: 52vh;
            overflow-y: auto;
            padding-right: 2px;
        }
        .payment-editor-row {
            display: grid;
            grid-template-columns: 96px minmax(0, 1fr) 36px;
            gap: 10px;
            align-items: center;
        }
        .payment-editor-row select,
        .payment-editor-row input {
            width: 100%;
            padding: 12px 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fafafa;
            color: #333;
            font-size: 14px;
        }
        .payment-editor-row .remove-payment {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: #f5f5f5;
            color: #ff4757;
            cursor: pointer;
        }
        .payment-editor-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 14px;
        }
        .payment-modal-content {
            max-width: 620px;
            max-height: 86vh;
            padding: 16px 16px 20px;
        }
        .payment-total-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #fff0f6;
            color: #ff4fa8;
            font-weight: 700;
        }
        body.dark .payment-summary-box,
        body.dark .payment-editor-row select,
        body.dark .payment-editor-row input {
            border-color: #3b3038;
            background: #171216;
            color: #f3edf2;
        }
        body.dark .payment-summary-text {
            color: #f3edf2;
        }
        body.dark .payment-total-line {
            background: #382332;
            color: #ff8bc8;
        }
        body.dark .payment-editor-row .remove-payment {
            background: #302730;
        }
        .form-group .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .form-group .radio-group label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            padding: 4px 10px;
            border: 1px solid #eee;
            border-radius: 14px;
            transition: all 0.2s;
        }
        .form-group .radio-group input[type="radio"] {
            display: none;
        }
        .form-group .radio-group input[type="radio"]:checked + span {
            color: #ff69b4;
        }

        <div class="modal-header">
            <h3 id="formModalTitle">新增记录</h3>
            <button class="close-btn" onclick="closeFormModal()">✕</button>
        </div>
        <form id="recordForm" onsubmit="saveRecord(event)">
            <input type="hidden" id="editId" value="">
            <input type="hidden" id="formImageData" value="">
            <input type="hidden" id="formDepositAmount" value="">
            <input type="hidden" id="formBalanceAmount" value="">
            <input type="hidden" id="formShippingAmount" value="">
            <input type="hidden" id="formPaymentItems" value="">

                    <div class="image-preview" id="imagePreview">🛍</div>

                        <label for="formImage">上传图片</label>
                        <input type="file" id="formImage" accept="image/*" onchange="handleImageUpload(event)">

                    </div>
                </div>

                    <label>商品名称 *</label>

                    <label>品牌</label>
                    <input type="hidden" id="formBrand" value="">

                        <option value="">选择</option>
                        <option value="梨涡">梨涡</option>
                        <option value="小满">小满</option>
                        <option value="圆点">圆点</option>
                        <option value="娃丽比">娃丽比</option>
                        <option value="澳泷哩">澳泷哩</option>
                        <option value="balabala">balabala</option>
                        <option value="__custom__">自定义</option>
                    </select>
                    <input class="brand-custom-input" type="text" id="formBrandCustom" placeholder="输入品牌" oninput="syncBrandValue()">
                </div>
            </div>
            <div class="form-row two-col">
                <div class="form-group">
                    <label>购买平台</label>
                    <input type="hidden" id="formPlatform" value="">

<script>
    // ===== 数据管理 =====
    const APP_VERSION = '20260727-detail-channel-quantity-swap';
    const BRAND_OPTIONS = ['梨涡', '小满', '圆点', '娃丽比', '澳泷哩', 'balabala'];
    const PLATFORM_OPTIONS = ['淘宝', '京东', '微信群'];
    const API_BASE = '';
    let records = [];
    let sortDraftRecords = [];
    let sortDragState = null;
    let currentFilter = '';
    let currentDetailId = null;
    const THEME_KEY = 'shopping_list_theme';

    async function apiRequest(url, options = {}) {
        const response = await fetch(API_BASE + url, {
            headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
            ...options,
        });
        if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `请求失败：${response.status}`);
        }
        if (response.status === 204) return null;
        return response.json();
    }

    async function loadRecordsFromApi() {
        try {
            records = await apiRequest('/api/records');
            renderGrid();
        } catch (error) {
            document.getElementById('productGrid').innerHTML =
                `<div class="empty-state"><div class="empty-icon">!</div><div class="empty-text">数据库连接失败，请确认后端服务已启动</div></div>`;
            console.error(error);
        }
    }

    function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.body.classList.toggle('dark', isDark);
        const btn = document.getElementById('themeToggle');
        if (btn) {
            btn.textContent = isDark ? '☀' : '☾';
            btn.title = isDark ? '浅色模式' : '深色模式';
        }
    }

    function getThemeByTime(date = new Date()) {
        const hour = date.getHours();
        return (hour >= 18 || hour < 7) ? 'dark' : 'light';
    }

    function toggleTheme() {
        const nextTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
        localStorage.setItem(THEME_KEY, nextTheme);
        applyTheme(nextTheme);
    }

    function getFilteredRecords() {
        if (!currentFilter) return records;
        return records.filter(r => r.status === currentFilter);
    }

    function updateStats() {
        const total = records.length;
        const totalPrice = records.reduce((s, r) => s + totalAmount(r), 0);
        document.getElementById('totalCount').textContent = `已收录 ${total}`;
        document.getElementById('totalPrice').textContent = `总价 ¥${totalPrice.toFixed(2)}`;
    }

    // ===== 渲染商品网格 =====
    function renderGrid() {
        const grid = document.getElementById('productGrid');
        const filtered = getFilteredRecords();
        updateStats();

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state"><div class="empty-icon"></div><div class="empty-text">衣柜还是空空的</div><div class="empty-subtext">点右下角 + 收进第一件小衣服</div></div>`;
            return;
        }

        grid.innerHTML = filtered.map((r) => `
            <div class="product-card" onclick="openDetail('${r.id}')">
                    <div class="img-wrap">
                        ${r.imageData ? `<img src="${r.imageData}" alt="${escapeHtml(r.name)}">` : '<div class="placeholder-icon">🛍</div>'}
                        ${r.status ? `<div class="tag">${escapeHtml(r.status)}</div>` : ''}
                        <button class="quick-edit" type="button" onclick="quickEdit(event, '${r.id}')" title="编辑">✎</button>
                    </div>
                    <div class="card-body">
                        <div class="name">${escapeHtml(r.name)}</div>
                        <div class="price">¥${totalAmount(r).toFixed(2)}</div>
                    </div>
                </div>
            `).join('');

    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function totalAmount(record) {
        const partsTotal = Number(record.depositAmount || 0) + Number(record.balanceAmount || 0) + Number(record.shippingAmount || 0);
        return partsTotal || Number(record.totalAmount || record.price || 0);
    }

    function openSortModal() {
        sortDraftRecords = [...records];
        renderSortList();
        document.getElementById('sortModal').classList.add('active');
    }

    function closeSortModal() {
        clearSortDragState();
        document.getElementById('sortModal').classList.remove('active');
        sortDraftRecords = [];
    }

    function renderSortList() {
        const list = document.getElementById('sortList');
        if (!sortDraftRecords.length) {
            list.innerHTML = '<div class="sort-empty">暂无订单可以排序</div>';
            return;
        }
        list.innerHTML = sortDraftRecords.map((r, index) => `
            <div class="sort-row ${sortDragState && String(sortDragState.id) === String(r.id) ? 'dragging' : ''}" data-sort-id="${r.id}" onpointerdown="startSortLongPress(event, '${r.id}')">
                <div class="sort-number-badge" aria-hidden="true">
                    <span class="sort-index">${index + 1}</span>
                </div>
                ${r.imageData
                    ? `<img class="sort-thumb" src="${r.imageData}" alt="${escapeHtml(r.name)}">`
                    : '<div class="sort-thumb sort-placeholder">🛍</div>'}
                <div class="sort-info">
                    <div class="sort-name">${escapeHtml(r.name)}</div>
                    <div class="sort-meta">¥${totalAmount(r).toFixed(2)} · ${escapeHtml(r.status || '未设置')}</div>
                </div>
            </div>
        `).join('');
    }

    function startSortLongPress(event, id) {
        event.preventDefault();
        event.stopPropagation();
        clearSortDragState();
        if (event.currentTarget?.setPointerCapture && event.pointerId !== undefined) {
            try { event.currentTarget.setPointerCapture(event.pointerId); } catch (error) {}
        }
        sortDragState = {
            id,
            startX: event.clientX,
            startY: event.clientY,
            active: false,
            lastX: event.clientX,
            lastY: event.clientY,
            timer: window.setTimeout(() => {
                activateSortDrag(id);
            }, 160),
        };
        window.addEventListener('pointermove', handleSortPointerMove, { passive: false });
        window.addEventListener('pointerup', finishSortDrag, { once: true });
        window.addEventListener('pointercancel', finishSortDrag, { once: true });
    }

    function activateSortDrag(id) {
        if (!sortDragState || String(sortDragState.id) !== String(id) || sortDragState.active) return;
        sortDragState.active = true;
        if (navigator.vibrate) navigator.vibrate(18);
        document.body.classList.add('sort-dragging');
        const x = sortDragState.lastX ?? sortDragState.startX;
        const y = sortDragState.lastY ?? sortDragState.startY;
        renderSortList();
        createSortDragGhost(id, x, y);
    }

    function handleSortPointerMove(event) {
        if (!sortDragState) return;
        sortDragState.lastX = event.clientX;
        sortDragState.lastY = event.clientY;
        if (!sortDragState.active) return;
        event.preventDefault();
        moveSortDragGhost(event.clientX, event.clientY);
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('.sort-row');
        if (!target) return;
        const targetId = target.dataset.sortId;
        if (!targetId || String(targetId) === String(sortDragState.id)) return;
        const fromIndex = sortDraftRecords.findIndex(r => String(r.id) === String(sortDragState.id));
        const toIndex = sortDraftRecords.findIndex(r => String(r.id) === String(targetId));
        if (fromIndex < 0 || toIndex < 0) return;
        const [dragged] = sortDraftRecords.splice(fromIndex, 1);
        sortDraftRecords.splice(toIndex, 0, dragged);
        renderSortList();
    }

    function finishSortDrag() {
        clearSortDragState();
        renderSortList();
    }

    function clearSortDragState() {
        if (sortDragState?.timer) window.clearTimeout(sortDragState.timer);
        removeSortDragGhost();
        sortDragState = null;
        document.body.classList.remove('sort-dragging');
        window.removeEventListener('pointermove', handleSortPointerMove);
    }

    function findSortRowById(id) {
        return Array.from(document.querySelectorAll('.sort-row')).find(row => String(row.dataset.sortId) === String(id));
    }

    function createSortDragGhost(id, x, y) {
        removeSortDragGhost();
        const row = findSortRowById(id);
        if (!row || !sortDragState) return;
        const rect = row.getBoundingClientRect();
        const ghost = row.cloneNode(true);
        ghost.classList.remove('dragging');
        ghost.classList.add('sort-drag-ghost');
        ghost.removeAttribute('data-sort-id');
        ghost.removeAttribute('onpointerdown');
        sortDragState.ghost = ghost;
        sortDragState.ghostOffsetX = Math.min(Math.max(x - rect.left, 28), rect.width - 28);
        sortDragState.ghostOffsetY = Math.min(Math.max(y - rect.top, 24), rect.height - 24);
        ghost.style.width = `${rect.width}px`;
        document.body.appendChild(ghost);
        moveSortDragGhost(x, y);
    }

    function moveSortDragGhost(x, y) {
        const ghost = sortDragState?.ghost;
        if (!ghost) return;
        ghost.style.left = `${x - sortDragState.ghostOffsetX}px`;
        ghost.style.top = `${y - sortDragState.ghostOffsetY}px`;
    }

    function removeSortDragGhost() {
        const ghost = sortDragState?.ghost;
        if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    }

    async function saveSortOrder() {
        records = [...sortDraftRecords];
        renderGrid();
        try {
            await apiRequest('/api/records/reorder', {
                method: 'PUT',
                body: JSON.stringify({ ids: records.map(r => Number(r.id)) }),
            });
            closeSortModal();
            await loadRecordsFromApi();
        } catch (error) {
            alert('排序保存失败，请稍后再试。');
            await loadRecordsFromApi();
            console.error(error);
        }
    }

    function paymentLabel(record) {
        if (Array.isArray(record.paymentItems) && record.paymentItems.length) {
            const items = record.paymentItems
                .map(item => ({ type: item.type || '正常', amount: parseFloat(item.amount) || 0 }))
                .filter(item => item.amount > 0);
            if (items.length) {
                const label = items.map(item => `${item.type}${item.amount.toFixed(0)}`).join('+');
                return `${label} = ${totalAmount(record).toFixed(0)}`;
            }
        }
        const labels = [];
        if (Number(record.depositAmount || 0) > 0) labels.push('定金');
        if (Number(record.balanceAmount || 0) > 0) labels.push('尾款');
        if (Number(record.shippingAmount || 0) > 0) labels.push('运费');
        if (labels.length) return `${labels.join('+')} ${totalAmount(record).toFixed(0)}`;
        return record.paymentType || '正常';
    }

    function paymentDetailHtml(record) {
        const items = normalizePaymentItems(record);
        if (!items.length) return escapeHtml(record.paymentType || '正常');
        const chips = items.map(item => `
            <span class="payment-chip">
                <span>${escapeHtml(item.type)}</span>
                <span class="amount">¥${Number(item.amount || 0).toFixed(2)}</span>
            </span>
        `).join('');
        return `
            <span class="payment-breakdown">
                ${chips}
            </span>
        `;
    }

    function paymentTypeClass(record) {
        const type = record.paymentType || '正常';
        if (Number(record.shippingAmount || 0) > 0) return 'shipping';
        if (Number(record.depositAmount || 0) > 0 && Number(record.balanceAmount || 0) > 0) return 'balance';
        if (type === '定金') return 'deposit';
        if (type === '尾款') return 'balance';
        return 'normal';
    }

    // ===== 标签切换 =====
    document.getElementById('tabBar').addEventListener('click', (e) => {
        const tab = e.target.closest('.tab-item');
        if (!tab) return;
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.status || '';
        renderGrid();
    });

    // ===== 新增/编辑弹窗 =====
    function openAddModal() {
        document.getElementById('formModalTitle').textContent = '新增记录';
        document.getElementById('editId').value = '';
        document.getElementById('formImageData').value = '';
        document.getElementById('formImage').value = '';
        updateImagePreview('');
        document.getElementById('formName').value = '';
        setBrandValue('');
        setPlatformValue('');
        document.getElementById('formOrderNo').value = '';
        document.getElementById('formPrice').value = '';
        document.getElementById('formDepositAmount').value = '';
        document.getElementById('formBalanceAmount').value = '';
        document.getElementById('formShippingAmount').value = '';
        document.getElementById('formPaymentItems').value = '';
        refreshPaymentSummary();
        document.getElementById('formQuantity').value = '1';
        document.querySelector('input[name="formStatus"][value="已购买"]').checked = true;
        document.getElementById('formDate').value = '';
        document.getElementById('formNote').value = '';
        document.getElementById('formModal').classList.add('active');
        resetFormModalScroll();
    }

    function openEditModal(id) {
        const r = records.find(x => x.id == id);
        if (!r) return;
        document.getElementById('formModalTitle').textContent = '编辑记录';
        document.getElementById('editId').value = r.id;
        document.getElementById('formName').value = r.name;
        setBrandValue(r.brand || '');
        setPlatformValue(r.platform || '');
        document.getElementById('formOrderNo').value = r.orderNo || '';
        document.getElementById('formPrice').value = Number(r.price || r.totalAmount || 0) || '';
        document.getElementById('formDepositAmount').value = Number(r.depositAmount || 0) || '';
        document.getElementById('formBalanceAmount').value = Number(r.balanceAmount || 0) || '';
        document.getElementById('formShippingAmount').value = Number(r.shippingAmount || 0) || '';
        document.getElementById('formPaymentItems').value = JSON.stringify(normalizePaymentItems(r));
        refreshPaymentSummary();
        document.getElementById('formQuantity').value = r.quantity;
        const statusInput = document.querySelector(`input[name="formStatus"][value="${r.status}"]`);
        (statusInput || document.querySelector('input[name="formStatus"][value="已购买"]')).checked = true;
        document.getElementById('formImageData').value = r.imageData || '';
        document.getElementById('formImage').value = '';
        updateImagePreview(r.imageData || '');
        document.getElementById('formDate').value = r.date || '';
        document.getElementById('formNote').value = r.note || '';
        document.getElementById('formModal').classList.add('active');
        resetFormModalScroll();
    }

    function closeFormModal() {
        document.getElementById('formModal').classList.remove('active');
    }

    function resetFormModalScroll() {
        const content = document.querySelector('#formModal .modal-content');
        if (content) content.scrollTop = 0;
    }

    function getBrandValue() {
        syncBrandValue();
        return document.getElementById('formBrand').value.trim();
    }

    function setBrandValue(value) {
        const brand = (value || '').trim();
        const select = document.getElementById('formBrandSelect');
        const custom = document.getElementById('formBrandCustom');
        if (!brand) {
            select.value = '';
            custom.value = '';
            custom.classList.remove('active');
        } else if (BRAND_OPTIONS.includes(brand)) {
            select.value = brand;
            custom.value = '';
            custom.classList.remove('active');
        } else {
            select.value = '__custom__';
            custom.value = brand;
            custom.classList.add('active');
        }
        syncBrandValue();
    }

    function handleBrandSelectChange() {
        const custom = document.getElementById('formBrandCustom');
        custom.classList.toggle('active', document.getElementById('formBrandSelect').value === '__custom__');
        if (!custom.classList.contains('active')) custom.value = '';
        syncBrandValue();
    }

    function syncBrandValue() {
        const selected = document.getElementById('formBrandSelect').value;
        const custom = document.getElementById('formBrandCustom').value.trim();
        document.getElementById('formBrand').value = selected === '__custom__' ? custom : selected;
    }

    function setPlatformValue(value) {
        const platform = (value || '').trim();
        const select = document.getElementById('formPlatformSelect');
        const custom = document.getElementById('formPlatformCustom');
        if (!platform) {
            select.value = '';
            custom.value = '';
            custom.classList.remove('active');
        } else if (PLATFORM_OPTIONS.includes(platform)) {
            select.value = platform;
            custom.value = '';
            custom.classList.remove('active');
        } else {
            select.value = '__custom__';
            custom.value = platform;
            custom.classList.add('active');
        }
        syncPlatformValue();
    }

    function handlePlatformSelectChange() {
        const custom = document.getElementById('formPlatformCustom');
        custom.classList.toggle('active', document.getElementById('formPlatformSelect').value === '__custom__');
        if (!custom.classList.contains('active')) custom.value = '';
        syncPlatformValue();
    }

    function syncPlatformValue() {
        const selected = document.getElementById('formPlatformSelect').value;
        const custom = document.getElementById('formPlatformCustom').value.trim();
        document.getElementById('formPlatform').value = selected === '__custom__' ? custom : selected;
    }

    function getPlatformValue() {
        syncPlatformValue();
        return document.getElementById('formPlatform').value.trim();
    }

    function updateImagePreview(src) {
        const preview = document.getElementById('imagePreview');
        preview.innerHTML = src ? `<img src="${src}" alt="商品图片预览">` : '🛍';
    }

    function clearImage() {
        document.getElementById('formImageData').value = '';
        document.getElementById('formImage').value = '';
        updateImagePreview('');
    }

    function paymentInputsToItems() {
        const detailInput = document.getElementById('formPaymentItems');
        if (detailInput && detailInput.value) {
            try {
                const savedItems = JSON.parse(detailInput.value);
                if (Array.isArray(savedItems)) {
                    return savedItems
                        .map(item => ({ type: item.type || '正常', amount: parseFloat(item.amount) || 0 }))
                        .filter(item => item.amount > 0);
                }
            } catch (error) {
                console.warn('付款明细解析失败，改用汇总字段。', error);
            }
        }
        const items = [];
        const deposit = parseFloat(document.getElementById('formDepositAmount').value) || 0;
        const balance = parseFloat(document.getElementById('formBalanceAmount').value) || 0;
        const shipping = parseFloat(document.getElementById('formShippingAmount').value) || 0;
        const fallback = parseFloat(document.getElementById('formPrice').value) || 0;
        if (deposit > 0) items.push({ type: '定金', amount: deposit });
        if (balance > 0) items.push({ type: '尾款', amount: balance });
        if (shipping > 0) items.push({ type: '运费', amount: shipping });
        if (items.length === 0 && fallback > 0) items.push({ type: '正常', amount: fallback });
        return items;
    }

    function normalizePaymentItems(record) {
        if (record && Array.isArray(record.paymentItems) && record.paymentItems.length) {
            return record.paymentItems
                .map(item => ({ type: item.type || '正常', amount: parseFloat(item.amount) || 0 }))
                .filter(item => item.amount > 0);
        }
        const items = [];
        const deposit = parseFloat(record?.depositAmount) || 0;
        const balance = parseFloat(record?.balanceAmount) || 0;
        const shipping = parseFloat(record?.shippingAmount) || 0;
        const fallback = parseFloat(record?.price || record?.totalAmount) || 0;
        if (deposit > 0) items.push({ type: '定金', amount: deposit });
        if (balance > 0) items.push({ type: '尾款', amount: balance });
        if (shipping > 0) items.push({ type: '运费', amount: shipping });
        if (items.length === 0 && fallback > 0) items.push({ type: record?.paymentType || '正常', amount: fallback });
        return items;
    }

    function applyPaymentItems(items) {
        let deposit = 0;
        let balance = 0;
        let shipping = 0;
        let normal = 0;
        items.forEach(item => {
            const amount = parseFloat(item.amount) || 0;
            if (amount <= 0) return;
            if (item.type === '定金') deposit += amount;
            else if (item.type === '尾款') balance += amount;
            else if (item.type === '运费') shipping += amount;
            else normal += amount;
        });
        document.getElementById('formDepositAmount').value = deposit || '';
        document.getElementById('formBalanceAmount').value = balance || '';
        document.getElementById('formShippingAmount').value = shipping || '';
        document.getElementById('formPrice').value = (deposit + balance + shipping + normal) || '';
        document.getElementById('formPaymentItems').value = JSON.stringify(items);
        refreshPaymentSummary();
    }

    function refreshPaymentSummary() {
        const summary = document.getElementById('paymentSummaryText');
        if (!summary) return;
        const items = paymentInputsToItems();
        if (!items.length) {
            summary.textContent = '未录入付款';
            return;
        }
        const total = items.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
        const label = items.map(item => `${item.type}${Number(item.amount).toFixed(0)}`).join(' + ');
        summary.textContent = `${label} = ¥${total.toFixed(2)}`;
    }

    function paymentRowTemplate(item = { type: '正常', amount: '' }) {
        return `
            <div class="payment-editor-row">
                <select class="payment-kind">
                    <option value="定金" ${item.type === '定金' ? 'selected' : ''}>定金</option>
                    <option value="尾款" ${item.type === '尾款' ? 'selected' : ''}>尾款</option>
                    <option value="运费" ${item.type === '运费' ? 'selected' : ''}>运费</option>
                    <option value="正常" ${item.type === '正常' ? 'selected' : ''}>正常</option>
                </select>
                <input class="payment-amount" type="number" step="0.01" min="0" placeholder="金额" value="${item.amount || ''}">
                <button type="button" class="remove-payment" onclick="removePaymentRow(this)">×</button>
            </div>
        `;
    }

    function openPaymentModal() {
        const list = document.getElementById('paymentEditorList');
        const items = paymentInputsToItems();
        list.innerHTML = (items.length ? items : [{ type: '正常', amount: '' }])
            .map(item => paymentRowTemplate(item))
            .join('');
        refreshPaymentEditorTotal();
        document.getElementById('paymentModal').classList.add('active');
    }

    function closePaymentModal() {
        document.getElementById('paymentModal').classList.remove('active');
    }

    function addPaymentRow() {
        document.getElementById('paymentEditorList').insertAdjacentHTML('beforeend', paymentRowTemplate());
        refreshPaymentEditorTotal();
    }

    function removePaymentRow(button) {
        button.closest('.payment-editor-row').remove();
        refreshPaymentEditorTotal();
    }

    function readPaymentEditorItems() {
        const rows = Array.from(document.querySelectorAll('#paymentEditorList .payment-editor-row'));
        return rows.map(row => ({
            type: row.querySelector('.payment-kind').value,
            amount: parseFloat(row.querySelector('.payment-amount').value) || 0,
        })).filter(item => item.amount > 0);
    }

    function refreshPaymentEditorTotal() {
        const totalEl = document.getElementById('paymentEditorTotal');
        if (!totalEl) return;
        const total = readPaymentEditorItems().reduce((sum, item) => sum + item.amount, 0);
        totalEl.textContent = `¥${total.toFixed(2)}`;
    }

    function savePaymentModal() {
        applyPaymentItems(readPaymentEditorItems());
        closePaymentModal();
    }

    document.getElementById('paymentEditorList').addEventListener('input', refreshPaymentEditorTotal);
    document.getElementById('paymentEditorList').addEventListener('change', refreshPaymentEditorTotal);

    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function resizeImage(dataUrl, maxSize = 640, quality = 0.72) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;
                if (width > maxSize || height > maxSize) {
                    const scale = Math.min(maxSize / width, maxSize / height);
                    width = Math.round(width * scale);
                    height = Math.round(height * scale);
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => resolve(dataUrl);
            img.src = dataUrl;
        });
    }

    async function handleImageUpload(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            alert('请选择图片文件');
            event.target.value = '';
            return;
        }
        const rawData = await readFileAsDataURL(file);
        const imageData = await resizeImage(rawData);
        document.getElementById('formImageData').value = imageData;
        updateImagePreview(imageData);
    }

    async function saveRecord(e) {
        e.preventDefault();
        const editId = document.getElementById('editId').value;
        const data = {
            name: document.getElementById('formName').value.trim(),
            brand: getBrandValue(),
            platform: getPlatformValue(),
            orderNo: document.getElementById('formOrderNo').value.trim(),
            paymentType: inferPaymentType(),
            hasShipping: Number(document.getElementById('formShippingAmount').value || 0) > 0,
            price: totalFromForm(),
            depositAmount: parseFloat(document.getElementById('formDepositAmount').value) || 0,
            balanceAmount: parseFloat(document.getElementById('formBalanceAmount').value) || 0,
            shippingAmount: parseFloat(document.getElementById('formShippingAmount').value) || 0,
            paymentItems: paymentInputsToItems(),
            quantity: parseInt(document.getElementById('formQuantity').value) || 1,
            status: document.querySelector('input[name="formStatus"]:checked').value,
            date: document.getElementById('formDate').value,
            note: document.getElementById('formNote').value.trim(),
            imageData: document.getElementById('formImageData').value,
        };

        try {
            if (editId) {
                await apiRequest(`/api/records/${editId}`, {
                    method: 'PUT',
                    body: JSON.stringify(data),
                });
            } else {
                await apiRequest('/api/records', {
                    method: 'POST',
                    body: JSON.stringify(data),
                });
            }
            await loadRecordsFromApi();
            closeFormModal();
        } catch (error) {
            alert('保存到数据库失败，请检查后端服务。');
            console.error(error);
        }
    }

    function totalFromForm() {
        const itemTotal = paymentInputsToItems().reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
        if (itemTotal > 0) return itemTotal;
        const partsTotal =
            (parseFloat(document.getElementById('formDepositAmount').value) || 0) +
            (parseFloat(document.getElementById('formBalanceAmount').value) || 0) +
            (parseFloat(document.getElementById('formShippingAmount').value) || 0);
        return partsTotal || (parseFloat(document.getElementById('formPrice').value) || 0);
    }

    function inferPaymentType() {
        const items = paymentInputsToItems();
        const deposit = items.some(item => item.type === '定金');
        const balance = items.some(item => item.type === '尾款');
        const shipping = items.some(item => item.type === '运费');
        const normal = items.some(item => item.type === '正常');
        if (deposit > 0 && balance > 0) return '定金+尾款';
        if (deposit) return '定金';
        if (balance) return '尾款';
        if (shipping) return '运费';
        if (normal) return '正常';
        return '正常';
    }

    function quickEdit(event, id) {
        event.stopPropagation();
        openEditModal(id);
    }

    // ===== 详情弹窗 =====
    function openDetail(id) {
        const r = records.find(x => x.id == id);
        if (!r) return;
        currentDetailId = r.id;
        document.getElementById('detailTitle').textContent = r.name;
        const detailImage = document.querySelector('.detail-img-area');
        detailImage.classList.toggle('has-image', !!r.imageData);
        detailImage.innerHTML = r.imageData ? `<img src="${r.imageData}" alt="${escapeHtml(r.name)}">` : '🛍';
        detailImage.onclick = r.imageData ? () => openImageViewer(r.imageData, r.name) : null;
        const list = document.getElementById('detailList');
        const note = r.note ? escapeHtml(r.note) : '—';
        list.innerHTML = `
            <li><span class="icon">🏷</span><span class="label">品牌</span><span class="value">${escapeHtml(r.brand || '—')}</span></li>
            <li><span class="icon">📏</span><span class="label">尺码</span><span class="value">${escapeHtml(r.orderNo || '—')}</span></li>
            <li><span class="icon">渠</span><span class="label">渠道</span><span class="value">${escapeHtml(r.platform || '—')}</span></li>
            <li><span class="icon">♥</span><span class="label">状态</span><span class="value">${r.status}</span></li>
            <li class="wide payment-detail-row"><span class="icon">票</span><span class="label">付款</span><span class="value">${paymentDetailHtml(r)}</span></li>
            <li><span class="icon">¥</span><span class="label">合计</span><span class="value price">¥${totalAmount(r).toFixed(2)}</span></li>
            <li><span class="icon">日</span><span class="label">日期</span><span class="value">${escapeHtml(r.date || '—')}</span></li>
            <li><span class="icon">N</span><span class="label">数量</span><span class="value">${r.quantity}</span></li>
            <li><span class="icon">记</span><span class="label">备注</span><span class="value">${note}</span></li>
        `;
        document.getElementById('detailModal').classList.add('active');
    }

    function openImageViewer(src, name = '商品图片') {
        const img = document.getElementById('imageViewerImg');
        img.src = src;
        img.alt = name;
        document.getElementById('imageViewerModal').classList.add('active');
    }

    function closeImageViewer() {
        document.getElementById('imageViewerModal').classList.remove('active');
        document.getElementById('imageViewerImg').src = '';
    }

    function closeDetailModal() {
        document.getElementById('detailModal').classList.remove('active');
        currentDetailId = null;
    }

    function editFromDetail() {
        if (currentDetailId) {
            const id = currentDetailId;
            closeDetailModal();
            openEditModal(id);
        }
    }

    async function deleteFromDetail() {
        if (currentDetailId && confirm('确定要删除这条记录吗？')) {
            try {
                await apiRequest(`/api/records/${currentDetailId}`, { method: 'DELETE' });
                closeDetailModal();
                await loadRecordsFromApi();
            } catch (error) {
                alert('从数据库删除失败，请检查后端服务。');
                console.error(error);
            }
        }
    }

    // ===== 切换视图（保留功能） =====
    let isGridView = true;
    function toggleView() {
        isGridView = !isGridView;
        const grid = document.getElementById('productGrid');
        if (isGridView) {
            grid.style.display = 'grid';
        } else {
            grid.style.display = 'block';
        }
    }

    // ===== 初始化 =====
    applyTheme(getThemeByTime());
    window.GMQD_VERSION = APP_VERSION;
    renderGrid();
    loadRecordsFromApi();

    // 点击蒙层关闭弹窗
    document.querySelectorAll('.modal-overlay').forEach(el => {
        el.addEventListener('click', (e) => {
            if (e.target === el) {
                el.classList.remove('active');
            }
        });
    });
</script>
</body>
