<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>柚子的衣柜 - 购买商品记录管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #fff7fa;
            color: #333;
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }
        body.dark {
            background-color: #161316;
            color: #f3edf2;
        }

        /* ===== 顶部 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 16px;
            font-size: 12px;
            color: #333;
            background: #fff8f8;
        }
        body.dark .status-bar {
            background: #161316;
            color: #f3edf2;
        }
        body.dark .status-bar .icons svg {
            fill: #f3edf2;
        }
        .status-bar .time {
            font-weight: 600;
        }
        .status-bar .icons {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-bar .icons svg {
            width: 14px;
            height: 14px;
            fill: #333;
        }

        /* ===== 导航栏 ===== */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #fff8f8;
            border-bottom: 1px solid #f0e0e0;
        }
        body.dark .nav-bar {
            background: #161316;
            border-bottom-color: #332a31;
        }
        .nav-bar .left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        body.dark .nav-bar .right .action-btn {
            color: #f3edf2;
        }
        .nav-bar .logo {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-bar .logo .logo-icon {
            background: #ff4757;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .nav-bar .logo .logo-text {
            font-size: 16px;
            font-weight: 600;
        }
        .nav-bar .right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-bar .right .action-btn {
            font-size: 18px;
            cursor: pointer;
            color: #333;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .nav-bar .right .theme-btn {
            border: 1px solid #f0d9e5;
            background: #fff;
            color: #333;
            font-size: 14px;
        }
        body.dark .nav-bar .right .theme-btn {
            border-color: #473642;
            background: #241d23;
            color: #f3edf2;
        }
        .nav-bar .right .action-btn:hover {
            background: #f0e0e0;
        }

        /* ===== 头部信息 ===== */
        .header-info {
            padding: 16px 20px 12px;
            background: #fff7fa;
        }
        body.dark .header-info {
            background: #161316;
        }
        .header-info .title {
            font-size: 22px;
            font-weight: 700;
            color: #000;
            margin-bottom: 4px;
        }
        body.dark .header-info .title {
            color: #fff;
        }
        .header-info .subtitle {
            font-size: 14px;
            color: #999;
        }
        .header-info .subtitle span {
            margin-right: 12px;
        }
        /* ===== 标签切换 ===== */
        .tab-bar {
            display: flex;
            gap: 0;
            padding: 0 20px 12px;
            background: #fff7fa;
            border-bottom: 1px solid #f0e0e0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        body.dark .tab-bar {
            background: #161316;
            border-bottom-color: #332a31;
        }
        .tab-bar::-webkit-scrollbar {
            display: none;
        }
        .tab-bar .tab-item {
            flex-shrink: 0;
            padding: 6px 14px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.2s;
            white-space: nowrap;
            margin-right: 8px;
        }
        body.dark .tab-bar .tab-item {
            color: #cdbfc8;
        }
        .tab-bar .tab-item.active {
            background: #ff69b4;
            color: #fff;
        }
        .tab-bar .tab-item:hover:not(.active) {
            background: #ffe0ec;
        }
        body.dark .tab-bar .tab-item:hover:not(.active) {
            background: #2a2028;
        }

        /* ===== 商品网格 ===== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            column-gap: 18px;
            row-gap: 26px;
            padding: 28px 34px 96px;
            background: #fff7fa;
            border-radius: 0;
        }
        .product-card {
            background: transparent;
            border-radius: 0;
            overflow: visible;
            box-shadow: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        body.dark .product-card {
            background: transparent;
            box-shadow: none;
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: none;
        }
        .product-card .img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fff;
            overflow: hidden;
            border-radius: 18px;
        }
        .product-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        body.dark .product-card .img-wrap {
            background: #2a2429;
        }
        .product-card .img-wrap .placeholder-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            color: #ddd;
        }
        .product-card .img-wrap .tag {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            min-width: 62px;
            padding: 4px 12px;
            border-radius: 0 0 8px 8px;
            background: #ff86ad;
            color: #fff;
            text-align: center;
            font-size: 12px;
            line-height: 1.2;
            white-space: nowrap;
        }
        .product-card .quick-edit {
            position: absolute;
            right: 5px;
            bottom: 5px;
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            color: #ff4fa8;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        body.dark .product-card .quick-edit {
            background: rgba(33, 27, 32, 0.92);
            color: #ff8bc8;
        }
        .product-card .card-body {
            position: relative;
            padding: 8px 0 0;
            text-align: center;
        }
        .product-card .card-body .name {
            font-size: 15px;
            color: #000;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 20px;
            padding: 0 2px;
        }
        body.dark .product-card .card-body .name {
            color: #fff;
        }
        .product-card .card-body .price {
            font-size: 17px;
            color: #ff69b4;
            font-weight: 700;
            margin-top: 7px;
        }
        .product-card .card-body .payment-row {
            display: none;
        }
        .payment-type {
            display: inline-flex;
            align-items: center;
            max-width: 100%;
            padding: 2px 7px;
            border-radius: 999px;
            background: #fff0f6;
            color: #ff4fa8;
            font-size: 10px;
            line-height: 1.5;
            white-space: nowrap;
        }
        .payment-type.deposit {
            background: #fff7d9;
            color: #b27800;
        }
        .payment-type.balance {
            background: #eaf2ff;
            color: #2f63c7;
        }
        .payment-type.shipping {
            background: #ebf8ef;
            color: #24844d;
        }
        body.dark .payment-type {
            background: #382332;
            color: #ff8bc8;
        }
        body.dark .payment-type.deposit {
            background: #3a3017;
            color: #f0c85a;
        }
        body.dark .payment-type.balance {
            background: #1d2a42;
            color: #8fb5ff;
        }
        body.dark .payment-type.shipping {
            background: #1d3527;
            color: #77d596;
        }
        body.dark .product-grid {
            background: #161316;
        }
        .product-card .card-body .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .product-card .card-body .meta .status {
            font-size: 10px;
            color: #999;
        }
        .product-card .card-body .meta .qty {
            font-size: 10px;
            color: #ccc;
        }

        /* ===== 底部添加按钮 ===== */
        .add-btn-wrap {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
        }
        .add-btn-wrap .add-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ff69b4;
            color: #fff;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .add-btn-wrap .add-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(255, 105, 180, 0.5);
        }

        /* ===== 弹窗/表单 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.42);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 22px;
            width: 100%;
            max-width: 500px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 18px 18px 20px;
            animation: modalPop 0.22s ease;
            box-shadow: 0 18px 46px rgba(0, 0, 0, 0.18);
        }
        body.dark .modal-content {
            background: #211b20;
            color: #f3edf2;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-content .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .modal-content .modal-header h3 {
            font-size: 22px;
            font-weight: 700;
            color: #2a2528;
        }
        .modal-content .modal-header .close-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: #f5f5f5;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }
        body.dark .modal-content .modal-header .close-btn {
            background: #302730;
            color: #f3edf2;
        }
        body.dark .modal-content .modal-header h3 {
            color: #f3edf2;
        }
        .form-group {
            margin-bottom: 7px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 2px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            min-height: 42px;
            border: 1px solid #eee;
            border-radius: 12px;
            font-size: 14px;
            color: #333;
            background: #fafafa;
            outline: none;
            transition: border-color 0.2s;
        }
        body.dark .form-group input,
        body.dark .form-group select,
        body.dark .form-group textarea {
            border-color: #3b3038;
            background: #171216;
            color: #f3edf2;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #ff69b4;
            background: #fff;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 42px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1.1fr 0.8fr 1fr;
            gap: 10px;
            align-items: start;
        }
        .form-row.two-col {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: end;
        }
        .form-row label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 3px;
        }
        .form-row .form-group {
            margin-bottom: 7px;
            min-width: 0;
        }
        .form-row.two-col .form-group input {
            height: 46px;
        }
        .checkbox-line {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            color: #666;
            font-size: 13px;
            cursor: pointer;
        }
        .checkbox-line input {
            width: auto;
        }
        body.dark .checkbox-line {
            color: #d8cbd3;
        }
        .payment-summary-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fafafa;
        }
        .payment-summary-text {
            color: #333;
            font-size: 14px;
            line-height: 1.4;
        }
        .payment-summary-box button,
        .payment-editor-actions button {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            background: #fff0f6;
            color: #ff4fa8;
            white-space: nowrap;
        }
        .payment-editor-list {
            display: grid;
            gap: 12px;
            max-height: 52vh;
            overflow-y: auto;
            padding-right: 2px;
        }
        .payment-editor-row {
            display: grid;
            grid-template-columns: 96px minmax(0, 1fr) 36px;
            gap: 10px;
            align-items: center;
        }
        .payment-editor-row select,
        .payment-editor-row input {
            width: 100%;
            padding: 12px 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fafafa;
            color: #333;
            font-size: 14px;
        }
        .payment-editor-row .remove-payment {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: #f5f5f5;
            color: #ff4757;
            cursor: pointer;
        }
        .payment-editor-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 14px;
        }
        .payment-modal-content {
            max-width: 620px;
            max-height: 86vh;
            padding: 16px 16px 20px;
        }
        .payment-total-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #fff0f6;
            color: #ff4fa8;
            font-weight: 700;
        }
        body.dark .payment-summary-box,
        body.dark .payment-editor-row select,
        body.dark .payment-editor-row input {
            border-color: #3b3038;
            background: #171216;
            color: #f3edf2;
        }
        body.dark .payment-summary-text {
            color: #f3edf2;
        }
        body.dark .payment-total-line {
            background: #382332;
            color: #ff8bc8;
        }
        body.dark .payment-editor-row .remove-payment {
            background: #302730;
        }
        .form-group .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .form-group .radio-group label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            padding: 4px 10px;
            border: 1px solid #eee;
            border-radius: 14px;
            transition: all 0.2s;
        }
        .form-group .radio-group input[type="radio"] {
            display: none;
        }
        .form-group .radio-group input[type="radio"]:checked + span {
            color: #ff69b4;
        }
        .form-group .radio-group label:has(input:checked) {
            border-color: #ff69b4;
            background: #fff0f6;
        }
        body.dark .form-group .radio-group label {
            border-color: #3b3038;
            color: #d8cbd3;
        }
        body.dark .form-group .radio-group label:has(input:checked) {
            background: #382332;
        }
        .image-uploader {
            display: grid;
            grid-template-columns: 54px 1fr;
            gap: 9px;
            align-items: center;
        }
        .image-preview {
            width: 54px;
            height: 54px;
            border-radius: 8px;
            background: #f5f5f5;
            border: 1px dashed #e7cbd9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #ccc;
            font-size: 22px;
        }
        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .image-actions input {
            display: none;
        }
        .image-actions button,
        .image-actions label {
            border: none;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 12px;
            cursor: pointer;
            background: #fff0f6;
            color: #ff4fa8;
        }
        .image-actions .btn-remove-image {
            background: #f5f5f5;
            color: #999;
        }
        body.dark .image-preview {
            background: #171216;
            border-color: #493643;
        }
        body.dark .image-actions label {
            background: #382332;
        }
        body.dark .image-actions .btn-remove-image {
            background: #302730;
            color: #d8cbd3;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .modal-footer button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .form-modal-content {
            max-height: calc(100dvh - 28px);
            padding: 14px 16px 16px;
            background: #fff;
        }
        .form-modal-content .modal-header {
            margin-bottom: 6px;
        }
        .form-modal-content .modal-header h3 {
            font-size: 20px;
        }
        .form-modal-content .modal-header .close-btn {
            width: 26px;
            height: 26px;
            font-size: 15px;
        }
        .form-modal-content .form-group input,
        .form-modal-content .form-group select,
        .form-modal-content .form-group textarea {
            min-height: 38px;
            padding: 7px 10px;
            font-size: 13px;
        }
        .form-modal-content .form-row {
            gap: 6px;
        }
        .form-modal-content .form-row > .form-group {
            display: grid;
            grid-template-rows: auto 1fr;
            min-height: 46px;
            margin-bottom: 6px;
            padding: 5px 9px 4px;
            border: 1px solid #f1e4ea;
            border-radius: 12px;
            background: #fffafb;
            box-shadow: 0 1px 4px rgba(255, 105, 180, 0.04);
        }
        .form-modal-content .form-row > .form-group label {
            margin: 0;
            font-size: 10px;
            line-height: 1.1;
            color: #9c949a;
        }
        .form-modal-content .form-row > .form-group input {
            height: 24px;
            min-height: 24px;
            padding: 0;
            border: none;
            border-radius: 0;
            background: transparent;
            font-size: 14px;
            color: #2f2a2e;
        }
        .form-modal-content .form-row > .form-group input:focus {
            background: transparent;
        }
        body.dark .form-modal-content .form-row > .form-group {
            background: #171216;
            border-color: #332a31;
        }
        body.dark .form-modal-content .form-row > .form-group input {
            color: #f3edf2;
        }
        .form-modal-content .form-row.two-col .form-group input {
            height: 24px;
        }
        .form-modal-content .item-row {
            grid-template-columns: 1fr 0.72fr 1.12fr;
        }
        .form-modal-content .item-row > .form-group {
            min-height: 44px;
        }
        .form-modal-content .item-row .form-group input {
            height: 24px;
        }
        .form-modal-content .payment-summary-box {
            min-height: 40px;
            padding: 6px 9px;
            border-color: #f1e4ea;
            background: #fffafb;
            box-shadow: 0 1px 4px rgba(255, 105, 180, 0.04);
        }
        .form-modal-content .payment-summary-box button {
            padding: 7px 11px;
        }
        .form-modal-content .radio-group {
            gap: 6px;
        }
        .form-modal-content .form-group .radio-group label {
            padding: 4px 9px;
            font-size: 12px;
        }
        .form-modal-content textarea#formNote {
            min-height: 42px;
            height: 42px;
            resize: none;
            border-color: #f1e4ea;
            background: #fffafb;
        }
        body.dark .form-modal-content .payment-summary-box,
        body.dark .form-modal-content textarea#formNote {
            background: #171216;
            border-color: #332a31;
        }
        .form-modal-content .modal-footer button {
            border-radius: 14px;
        }
        .modal-footer button:hover {
            opacity: 0.85;
        }
        .modal-footer .btn-cancel {
            background: #f5f5f5;
            color: #666;
        }
        .modal-footer .btn-save {
            background: #ff69b4;
            color: #fff;
        }

        /* ===== 详情弹窗 ===== */
        .modal-content.detail-modal {
            max-height: 86vh;

<!-- ===== 详情弹窗 ===== -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-content detail-modal">
        <div class="modal-header">
            <h3>商品详情</h3>
            <button class="close-btn" onclick="closeDetailModal()">✕</button>
        </div>
        <div class="detail-img-area">🛍</div>
        <div class="detail-title" id="detailTitle">—</div>
        <ul class="detail-list" id="detailList">
        </ul>
        <div class="detail-actions">
            <button class="btn-edit" onclick="editFromDetail()">编辑</button>
            <button class="btn-delete" onclick="deleteFromDetail()">删除</button>
        </div>
    </div>
</div>

<script>
    // ===== 数据管理 =====
    const APP_VERSION = '20260725-compact-field-cards';
    const API_BASE = '';
    let records = [];
    let currentFilter = '';
    let currentDetailId = null;
    const THEME_KEY = 'shopping_list_theme';

    async function apiRequest(url, options = {}) {
        const response = await fetch(API_BASE + url, {
            headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
            ...options,
        });
        if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `请求失败：${response.status}`);
        }
        if (response.status === 204) return null;
        return response.json();
    }

    async function loadRecordsFromApi() {
        try {
            records = await apiRequest('/api/records');
            renderGrid();
        } catch (error) {
            document.getElementById('productGrid').innerHTML =
                `<div class="empty-state"><div class="empty-icon">!</div><div class="empty-text">数据库连接失败，请确认后端服务已启动</div></div>`;
            console.error(error);
        }
    }

    function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.body.classList.toggle('dark', isDark);
        const btn = document.getElementById('themeToggle');
        if (btn) {
            btn.textContent = isDark ? '☀' : '☾';
            btn.title = isDark ? '浅色模式' : '深色模式';
        }
    }

    function getThemeByTime(date = new Date()) {
        const hour = date.getHours();
        return (hour >= 18 || hour < 7) ? 'dark' : 'light';
    }

    function toggleTheme() {
        const nextTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
        localStorage.setItem(THEME_KEY, nextTheme);
        applyTheme(nextTheme);
    }

    function getFilteredRecords() {
        if (!currentFilter) return records;
        return records.filter(r => r.status === currentFilter);
    }

    function updateStats() {
        const total = records.length;
        const totalPrice = records.reduce((s, r) => s + totalAmount(r), 0);
        document.getElementById('totalCount').textContent = `已收录 ${total}`;
        document.getElementById('totalPrice').textContent = `总价 ¥${totalPrice.toFixed(2)}`;
    }

    // ===== 渲染商品网格 =====
    function renderGrid() {
        const grid = document.getElementById('productGrid');
        const filtered = getFilteredRecords();

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">还没有记录，点击 + 添加</div></div>`;
            return;
        }

        grid.innerHTML = filtered.map(r => `
            <div class="product-card" onclick="openDetail('${r.id}')">
                    <div class="img-wrap">
                        ${r.imageData ? `<img src="${r.imageData}" alt="${escapeHtml(r.name)}">` : '<div class="placeholder-icon">🛍</div>'}
                        ${r.status ? `<div class="tag">${escapeHtml(r.status)}</div>` : ''}
                        <button class="quick-edit" type="button" onclick="quickEdit(event, '${r.id}')" title="编辑">✎</button>
                    </div>
                    <div class="card-body">
                        <div class="name">${escapeHtml(r.name)}</div>
                        <div class="price">¥${totalAmount(r).toFixed(2)}</div>
                    </div>
                </div>
            `).join('');

        updateStats();
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function totalAmount(record) {
        const partsTotal = Number(record.depositAmount || 0) + Number(record.balanceAmount || 0) + Number(record.shippingAmount || 0);
        return partsTotal || Number(record.totalAmount || record.price || 0);
    }

    function paymentLabel(record) {
        if (Array.isArray(record.paymentItems) && record.paymentItems.length) {
            const items = record.paymentItems
                .map(item => ({ type: item.type || '正常', amount: parseFloat(item.amount) || 0 }))
                .filter(item => item.amount > 0);
            if (items.length) {
                const label = items.map(item => `${item.type}${item.amount.toFixed(0)}`).join('+');
                return `${label} = ${totalAmount(record).toFixed(0)}`;
            }
        }
        const labels = [];
        if (Number(record.depositAmount || 0) > 0) labels.push('定金');
        if (Number(record.balanceAmount || 0) > 0) labels.push('尾款');
        if (Number(record.shippingAmount || 0) > 0) labels.push('运费');
        if (labels.length) return `${labels.join('+')} ${totalAmount(record).toFixed(0)}`;
        return record.paymentType || '正常';
    }

    function paymentTypeClass(record) {
        const type = record.paymentType || '正常';
        if (Number(record.shippingAmount || 0) > 0) return 'shipping';
        if (Number(record.depositAmount || 0) > 0 && Number(record.balanceAmount || 0) > 0) return 'balance';
        if (type === '定金') return 'deposit';
        if (type === '尾款') return 'balance';
        return 'normal';
    }

    // ===== 标签切换 =====
    document.getElementById('tabBar').addEventListener('click', (e) => {
        const tab = e.target.closest('.tab-item');
        if (!tab) return;
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.status || '';
        renderGrid();
    });

    // ===== 新增/编辑弹窗 =====
    function openAddModal() {
        document.getElementById('formModalTitle').textContent = '新增记录';
        document.getElementById('editId').value = '';
        document.getElementById('formImageData').value = '';
        document.getElementById('formImage').value = '';
        updateImagePreview('');
        document.getElementById('formName').value = '';
        document.getElementById('formBrand').value = '';
        document.getElementById('formPlatform').value = '';
        document.getElementById('formOrderNo').value = '';
        document.getElementById('formPrice').value = '';
        document.getElementById('formDepositAmount').value = '';
        document.getElementById('formBalanceAmount').value = '';
        document.getElementById('formShippingAmount').value = '';
        document.getElementById('formPaymentItems').value = '';
        refreshPaymentSummary();
        document.getElementById('formQuantity').value = '1';
        document.querySelector('input[name="formStatus"][value="待付款"]').checked = true;
        document.getElementById('formDate').value = new Date().toISOString().slice(0, 10);
        document.getElementById('formNote').value = '';
        document.getElementById('formModal').classList.add('active');
        resetFormModalScroll();
    }

    function openEditModal(id) {
        const r = records.find(x => x.id == id);
        if (!r) return;
        document.getElementById('formModalTitle').textContent = '编辑记录';
        document.getElementById('editId').value = r.id;
        document.getElementById('formName').value = r.name;
        document.getElementById('formBrand').value = r.brand || '';
        document.getElementById('formPlatform').value = r.platform || '';
        document.getElementById('formOrderNo').value = r.orderNo || '';
        document.getElementById('formPrice').value = Number(r.price || r.totalAmount || 0) || '';
        document.getElementById('formDepositAmount').value = Number(r.depositAmount || 0) || '';
        document.getElementById('formBalanceAmount').value = Number(r.balanceAmount || 0) || '';
        document.getElementById('formShippingAmount').value = Number(r.shippingAmount || 0) || '';
        document.getElementById('formPaymentItems').value = JSON.stringify(normalizePaymentItems(r));
        refreshPaymentSummary();
        document.getElementById('formQuantity').value = r.quantity;
        const statusInput = document.querySelector(`input[name="formStatus"][value="${r.status}"]`);
        if (statusInput) statusInput.checked = true;
        document.getElementById('formImageData').value = r.imageData || '';
        document.getElementById('formImage').value = '';
        updateImagePreview(r.imageData || '');
        document.getElementById('formDate').value = r.date || '';
        document.getElementById('formNote').value = r.note || '';
        document.getElementById('formModal').classList.add('active');
        resetFormModalScroll();
    }

    function closeFormModal() {
        document.getElementById('formModal').classList.remove('active');
    }

    function resetFormModalScroll() {
        const content = document.querySelector('#formModal .modal-content');
        if (content) content.scrollTop = 0;
    }

    function getBrandValue() {
        return document.getElementById('formBrand').value.trim();
    }

    function updateImagePreview(src) {
        const preview = document.getElementById('imagePreview');
        preview.innerHTML = src ? `<img src="${src}" alt="商品图片预览">` : '🛍';
    }

    function clearImage() {
        document.getElementById('formImageData').value = '';
        document.getElementById('formImage').value = '';
        updateImagePreview('');
    }

    function paymentInputsToItems() {
        const detailInput = document.getElementById('formPaymentItems');
        if (detailInput && detailInput.value) {
            try {
                const savedItems = JSON.parse(detailInput.value);
                if (Array.isArray(savedItems)) {
                    return savedItems
                        .map(item => ({ type: item.type || '正常', amount: parseFloat(item.amount) || 0 }))
                        .filter(item => item.amount > 0);
                }
            } catch (error) {
                console.warn('付款明细解析失败，改用汇总字段。', error);
            }
        }
        const items = [];
        const deposit = parseFloat(document.getElementById('formDepositAmount').value) || 0;
        const balance = parseFloat(document.getElementById('formBalanceAmount').value) || 0;
        const shipping = parseFloat(document.getElementById('formShippingAmount').value) || 0;
        const fallback = parseFloat(document.getElementById('formPrice').value) || 0;
        if (deposit > 0) items.push({ type: '定金', amount: deposit });
        if (balance > 0) items.push({ type: '尾款', amount: balance });
        if (shipping > 0) items.push({ type: '运费', amount: shipping });
        if (items.length === 0 && fallback > 0) items.push({ type: '正常', amount: fallback });
        return items;
    }

    function normalizePaymentItems(record) {
        if (record && Array.isArray(record.paymentItems) && record.paymentItems.length) {
            return record.paymentItems
                .map(item => ({ type: item.type || '正常', amount: parseFloat(item.amount) || 0 }))
                .filter(item => item.amount > 0);
        }
        const items = [];
        const deposit = parseFloat(record?.depositAmount) || 0;
        const balance = parseFloat(record?.balanceAmount) || 0;
        const shipping = parseFloat(record?.shippingAmount) || 0;
        const fallback = parseFloat(record?.price || record?.totalAmount) || 0;
        if (deposit > 0) items.push({ type: '定金', amount: deposit });
        if (balance > 0) items.push({ type: '尾款', amount: balance });
        if (shipping > 0) items.push({ type: '运费', amount: shipping });
        if (items.length === 0 && fallback > 0) items.push({ type: record?.paymentType || '正常', amount: fallback });
        return items;
    }

    function applyPaymentItems(items) {
        let deposit = 0;
        let balance = 0;
        let shipping = 0;
        let normal = 0;
        items.forEach(item => {
            const amount = parseFloat(item.amount) || 0;
            if (amount <= 0) return;
            if (item.type === '定金') deposit += amount;
            else if (item.type === '尾款') balance += amount;
            else if (item.type === '运费') shipping += amount;
            else normal += amount;
        });
        document.getElementById('formDepositAmount').value = deposit || '';
        document.getElementById('formBalanceAmount').value = balance || '';
        document.getElementById('formShippingAmount').value = shipping || '';
        document.getElementById('formPrice').value = (deposit + balance + shipping + normal) || '';
        document.getElementById('formPaymentItems').value = JSON.stringify(items);
        refreshPaymentSummary();
    }

    function refreshPaymentSummary() {
        const summary = document.getElementById('paymentSummaryText');
        if (!summary) return;
        const items = paymentInputsToItems();
        if (!items.length) {
            summary.textContent = '未录入付款';
            return;
        }
        const total = items.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
        const label = items.map(item => `${item.type}${Number(item.amount).toFixed(0)}`).join(' + ');
        summary.textContent = `${label} = ¥${total.toFixed(2)}`;
    }

    function paymentRowTemplate(item = { type: '定金', amount: '' }) {
        return `
            <div class="payment-editor-row">
                <select class="payment-kind">
                    <option value="定金" ${item.type === '定金' ? 'selected' : ''}>定金</option>
                    <option value="尾款" ${item.type === '尾款' ? 'selected' : ''}>尾款</option>
                    <option value="运费" ${item.type === '运费' ? 'selected' : ''}>运费</option>
                    <option value="正常" ${item.type === '正常' ? 'selected' : ''}>正常</option>
                </select>
                <input class="payment-amount" type="number" step="0.01" min="0" placeholder="金额" value="${item.amount || ''}">
                <button type="button" class="remove-payment" onclick="removePaymentRow(this)">×</button>
            </div>
        `;
    }

    function openPaymentModal() {
        const list = document.getElementById('paymentEditorList');
        const items = paymentInputsToItems();
        list.innerHTML = (items.length ? items : [{ type: '定金', amount: '' }])
            .map(item => paymentRowTemplate(item))
            .join('');
        refreshPaymentEditorTotal();
        document.getElementById('paymentModal').classList.add('active');
    }

    function closePaymentModal() {
        document.getElementById('paymentModal').classList.remove('active');
    }

    function addPaymentRow() {
        document.getElementById('paymentEditorList').insertAdjacentHTML('beforeend', paymentRowTemplate());
        refreshPaymentEditorTotal();
    }

    function removePaymentRow(button) {
        button.closest('.payment-editor-row').remove();
        refreshPaymentEditorTotal();
    }

    function readPaymentEditorItems() {
        const rows = Array.from(document.querySelectorAll('#paymentEditorList .payment-editor-row'));
        return rows.map(row => ({
            type: row.querySelector('.payment-kind').value,
            amount: parseFloat(row.querySelector('.payment-amount').value) || 0,
        })).filter(item => item.amount > 0);
    }

    function refreshPaymentEditorTotal() {
        const totalEl = document.getElementById('paymentEditorTotal');
        if (!totalEl) return;
        const total = readPaymentEditorItems().reduce((sum, item) => sum + item.amount, 0);
        totalEl.textContent = `¥${total.toFixed(2)}`;
    }

    function savePaymentModal() {
        applyPaymentItems(readPaymentEditorItems());
        closePaymentModal();
    }

    document.getElementById('paymentEditorList').addEventListener('input', refreshPaymentEditorTotal);
    document.getElementById('paymentEditorList').addEventListener('change', refreshPaymentEditorTotal);

    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function resizeImage(dataUrl, maxSize = 640, quality = 0.72) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;
                if (width > maxSize || height > maxSize) {
                    const scale = Math.min(maxSize / width, maxSize / height);
                    width = Math.round(width * scale);
                    height = Math.round(height * scale);
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => resolve(dataUrl);
            img.src = dataUrl;
        });
    }

    async function handleImageUpload(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            alert('请选择图片文件');
            event.target.value = '';
            return;
        }
        const rawData = await readFileAsDataURL(file);
        const imageData = await resizeImage(rawData);
        document.getElementById('formImageData').value = imageData;
        updateImagePreview(imageData);
    }

    async function saveRecord(e) {
        e.preventDefault();
        const editId = document.getElementById('editId').value;
        const data = {
            name: document.getElementById('formName').value.trim(),
            brand: getBrandValue(),
            platform: document.getElementById('formPlatform').value.trim(),
            orderNo: document.getElementById('formOrderNo').value.trim(),
            paymentType: inferPaymentType(),
            hasShipping: Number(document.getElementById('formShippingAmount').value || 0) > 0,
            price: totalFromForm(),
            depositAmount: parseFloat(document.getElementById('formDepositAmount').value) || 0,
            balanceAmount: parseFloat(document.getElementById('formBalanceAmount').value) || 0,
            shippingAmount: parseFloat(document.getElementById('formShippingAmount').value) || 0,
            paymentItems: paymentInputsToItems(),
            quantity: parseInt(document.getElementById('formQuantity').value) || 1,
            status: document.querySelector('input[name="formStatus"]:checked').value,
            date: document.getElementById('formDate').value,
            note: document.getElementById('formNote').value.trim(),
            imageData: document.getElementById('formImageData').value,
        };

        try {
            if (editId) {
                await apiRequest(`/api/records/${editId}`, {
                    method: 'PUT',
                    body: JSON.stringify(data),
                });
            } else {
                await apiRequest('/api/records', {
                    method: 'POST',
                    body: JSON.stringify(data),
                });
            }
            await loadRecordsFromApi();
            closeFormModal();
        } catch (error) {
            alert('保存到数据库失败，请检查后端服务。');
            console.error(error);
        }
    }

    function totalFromForm() {
        const itemTotal = paymentInputsToItems().reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
        if (itemTotal > 0) return itemTotal;
        const partsTotal =
            (parseFloat(document.getElementById('formDepositAmount').value) || 0) +
            (parseFloat(document.getElementById('formBalanceAmount').value) || 0) +
            (parseFloat(document.getElementById('formShippingAmount').value) || 0);
        return partsTotal || (parseFloat(document.getElementById('formPrice').value) || 0);
    }

    function inferPaymentType() {
        const items = paymentInputsToItems();
        const deposit = items.some(item => item.type === '定金');
        const balance = items.some(item => item.type === '尾款');
        const shipping = items.some(item => item.type === '运费');
        const normal = items.some(item => item.type === '正常');
        if (deposit > 0 && balance > 0) return '定金+尾款';
        if (deposit) return '定金';
        if (balance) return '尾款';
        if (shipping) return '运费';
        if (normal) return '正常';
        return '正常';
    }

    function quickEdit(event, id) {
        event.stopPropagation();
        openEditModal(id);
    }

    // ===== 详情弹窗 =====
    function openDetail(id) {
        const r = records.find(x => x.id == id);
        if (!r) return;
        currentDetailId = r.id;
        document.getElementById('detailTitle').textContent = r.name;
        const detailImage = document.querySelector('.detail-img-area');
        detailImage.classList.toggle('has-image', !!r.imageData);
        detailImage.innerHTML = r.imageData ? `<img src="${r.imageData}" alt="${escapeHtml(r.name)}">` : '🛍';
        const list = document.getElementById('detailList');
        const note = r.note ? escapeHtml(r.note) : '—';
        list.innerHTML = `
            <li><span class="icon">🏷</span><span class="label">品牌</span><span class="value">${escapeHtml(r.brand || '—')}</span></li>
            <li><span class="icon">📏</span><span class="label">尺码</span><span class="value">${escapeHtml(r.orderNo || '—')}</span></li>
            <li><span class="icon">N</span><span class="label">数量</span><span class="value">${r.quantity}</span></li>
            <li><span class="icon">♥</span><span class="label">状态</span><span class="value">${r.status}</span></li>
            <li class="wide"><span class="icon">票</span><span class="label">付款</span><span class="value">${escapeHtml(paymentLabel(r))}</span></li>
            <li><span class="icon">¥</span><span class="label">合计</span><span class="value price">¥${totalAmount(r).toFixed(2)}</span></li>
            <li><span class="icon">日</span><span class="label">日期</span><span class="value">${escapeHtml(r.date || '—')}</span></li>
            <li><span class="icon">渠</span><span class="label">渠道</span><span class="value">${escapeHtml(r.platform || '—')}</span></li>
            <li><span class="icon">记</span><span class="label">备注</span><span class="value">${note}</span></li>
        `;
        document.getElementById('detailModal').classList.add('active');
    }

    function closeDetailModal() {
        document.getElementById('detailModal').classList.remove('active');
        currentDetailId = null;
    }

    function editFromDetail() {
        if (currentDetailId) {
            const id = currentDetailId;
            closeDetailModal();
            openEditModal(id);
        }
    }

    async function deleteFromDetail() {
        if (currentDetailId && confirm('确定要删除这条记录吗？')) {
            try {
                await apiRequest(`/api/records/${currentDetailId}`, { method: 'DELETE' });
                await loadRecordsFromApi();
                closeDetailModal();
            } catch (error) {
                alert('从数据库删除失败，请检查后端服务。');
                console.error(error);
            }
        }
    }

    // ===== 切换视图（保留功能） =====
    let isGridView = true;
    function toggleView() {
        isGridView = !isGridView;
        const grid = document.getElementById('productGrid');
        if (isGridView) {
            grid.style.display = 'grid';
        } else {
            grid.style.display = 'block';
        }
    }

    // ===== 初始化 =====
    applyTheme(getThemeByTime());
    window.GMQD_VERSION = APP_VERSION;
    renderGrid();
    loadRecordsFromApi();

    // 点击蒙层关闭弹窗
    document.querySelectorAll('.modal-overlay').forEach(el => {
        el.addEventListener('click', (e) => {
            if (e.target === el) {
                el.classList.remove('active');
            }
        });
    });
</script>
